##############################################################
# AURA Cosmetics — Render Blueprint
# render.com → New → Blueprint → connect Swap7020/Ecommerce
##############################################################

services:

  # ── Django Backend ───────────────────────────────────────
  - type: web
    name: aura-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    # Build: install deps + collect static (uses dev settings = no real DB needed)
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    # Start: migrate then serve (production settings active at runtime)
    startCommand: >
      python manage.py migrate --noinput &&
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 3
      --timeout 120
      --log-level info
      --access-logfile -
    healthCheckPath: /api/products/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: aura-backend.onrender.com
      - key: FRONTEND_URL
        value: https://aura-frontend.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "False"
      # Cloudinary — add your values in Render dashboard
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Email — SendGrid
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.sendgrid.net
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: apikey
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: noreply@auracosmetics.in
      # Payments — add your values in Render dashboard
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

  # ── React Frontend (Static Site) ─────────────────────────
  - type: web
    name: aura-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://aura-backend.onrender.com/api
      - key: NODE_VERSION
        value: "20"

databases:
  - name: aura-db
    databaseName: aura_cosmetics
    user: aura_user
    region: singapore
    plan: free
