##############################################################
# AURA Cosmetics — Render Blueprint
# Deploy everything from one file:
#   render.com → New → Blueprint → connect GitHub repo
##############################################################

services:

  # ── Django Backend (Web Service) ─────────────────────────
  - type: web
    name: aura-backend
    runtime: python
    region: singapore          # closest to India
    plan: free                 # upgrade to starter for production
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: >
      gunicorn config.wsgi:application
      --bind 0.0.0.0:$PORT
      --workers 3
      --timeout 120
      --log-level info
      --access-logfile -
    healthCheckPath: /api/products/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a strong key
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: aura-backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: aura-redis
          type: redis
          property: connectionString
      - key: FRONTEND_URL
        value: https://aura-cosmetics.vercel.app   # update after frontend deploy
      - key: SECURE_SSL_REDIRECT
        value: "False"               # Render handles SSL at the load balancer
      # ── Cloudinary (add your values) ──
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ── Email / SendGrid (add your values) ──
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        value: smtp.sendgrid.net
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: apikey
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: noreply@auracosmetics.in
      # ── Payments (add your values) ──
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # ── JWT ──
      - key: JWT_ACCESS_TOKEN_LIFETIME_MINUTES
        value: "60"
      - key: JWT_REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"

  # ── Celery Worker ────────────────────────────────────────
  - type: worker
    name: aura-celery
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A config worker -l info --concurrency 2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: aura-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: aura-backend
          type: web
          envVarKey: SECRET_KEY

databases:

  # ── PostgreSQL ───────────────────────────────────────────
  - name: aura-db
    databaseName: aura_cosmetics
    user: aura_user
    region: singapore
    plan: free                 # 1GB storage on free tier

  # ── Redis ────────────────────────────────────────────────
  # Note: Add Redis manually in Render dashboard (free tier available)
  # Then link it as REDIS_URL env var on aura-backend and aura-celery
